<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap</title>
<!-- HEAD-STYLE:BEGIN -->
<style>
/* ------------------------------------------------------------------
   Roadmap dashboard styles.

   The palette is inherited from the AME Dev Environment theme in
   subprojects/AME/tools/devenv/ui/theme.py ("Holo-Cyan"): a near-black
   ground, a vivid cyan accent, panels separated by a background lift
   rather than borders, and no corner rounding anywhere.

   Light mode is the printed-briefing counterpart of the same palette:
   cool paper instead of white, and the cyan deepened so it still holds
   contrast on a light ground. Both modes are defined through the tokens
   below, so components never name a colour directly.
   ------------------------------------------------------------------ */

/* -- Tokens: light is the base, dark overrides ---------------------- */
:root {
  --ground:      #e9eef1;
  --panel:       #ffffff;
  --panel-sunk:  #dfe7eb;
  --hairline:    #c4d2da;
  --hairline-hi: #9fb6c2;

  --ink:         #0c1519;
  --ink-soft:    #33474f;
  --ink-dim:     #5a6d78;

  --accent:      #04627a;
  --accent-soft: #0d8fae;
  --accent-wash: rgba(4, 98, 122, 0.09);

  --state-done:    #8e9ba1;
  --state-active:  #04627a;
  --state-planned: #b8c2c7;
  --state-risk:    #c9820e;
  --state-blocked: #96131f;

  --gauge-track: #d3dee4;
  --gauge-gap:   var(--panel);

  --font-display: "Roboto Condensed", "Archivo Narrow", "Liberation Sans Narrow",
                  "Arial Narrow", system-ui, sans-serif;
  --font-body:    "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    Consolas, "Cascadia Mono", ui-monospace, "DejaVu Sans Mono",
                  "Liberation Mono", monospace;

  --measure: 66ch;
  --shell:   1220px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ground:      #04070a;
    --panel:       #0a1016;
    --panel-sunk:  #060b10;
    --hairline:    rgba(0, 120, 150, 0.30);
    --hairline-hi: rgba(0, 180, 210, 0.55);

    --ink:         #dcf0fa;
    --ink-soft:    #a8c2d0;
    --ink-dim:     #6b8b9d;

    --accent:      #00e6ff;
    --accent-soft: #00b4d2;
    --accent-wash: rgba(0, 230, 255, 0.10);

    --state-done:    #54707f;
    --state-active:  #00e6ff;
    --state-planned: #2c3f4b;
    --state-risk:    #ffb020;
    --state-blocked: #ff5a6b;

    --gauge-track: #10202b;
    --gauge-gap:   var(--panel);
  }
}

/* The viewer's theme toggle stamps data-theme on the root element and
   must win over the media query above, in both directions. */
:root[data-theme="light"] {
  --ground:      #e9eef1;
  --panel:       #ffffff;
  --panel-sunk:  #dfe7eb;
  --hairline:    #c4d2da;
  --hairline-hi: #9fb6c2;
  --ink:         #0c1519;
  --ink-soft:    #33474f;
  --ink-dim:     #5a6d78;
  --accent:      #04627a;
  --accent-soft: #0d8fae;
  --accent-wash: rgba(4, 98, 122, 0.09);
  --state-done:    #8e9ba1;
  --state-active:  #04627a;
  --state-planned: #b8c2c7;
  --state-risk:    #c9820e;
  --state-blocked: #96131f;
  --gauge-track: #d3dee4;
}

:root[data-theme="dark"] {
  --ground:      #04070a;
  --panel:       #0a1016;
  --panel-sunk:  #060b10;
  --hairline:    rgba(0, 120, 150, 0.30);
  --hairline-hi: rgba(0, 180, 210, 0.55);
  --ink:         #dcf0fa;
  --ink-soft:    #a8c2d0;
  --ink-dim:     #6b8b9d;
  --accent:      #00e6ff;
  --accent-soft: #00b4d2;
  --accent-wash: rgba(0, 230, 255, 0.10);
  --state-done:    #54707f;
  --state-active:  #00e6ff;
  --state-planned: #2c3f4b;
  --state-risk:    #ffb020;
  --state-blocked: #ff5a6b;
  --gauge-track: #10202b;
}

/* -- Base ----------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }

code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  color: var(--ink);
  background: var(--accent-wash);
  padding: 0 3px;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.shell {
  max-width: var(--shell);
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 40px);
}

.skip {
  position: absolute;
  left: -9999px;
}
.skip:focus {
  left: 8px;
  top: 8px;
  z-index: 10;
  background: var(--panel);
  padding: 8px 12px;
}

/* -- Masthead ------------------------------------------------------- */
.masthead {
  border-bottom: 1px solid var(--hairline);
  background: var(--panel-sunk);
}

.masthead__inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px 32px;
  padding-block: 26px 20px;
}

.masthead__title {
  font-family: var(--font-display);
  font-stretch: condensed;
  font-size: clamp(26px, 3.6vw, 40px);
  line-height: 1.05;
  letter-spacing: 0.012em;
  text-transform: uppercase;
}

.masthead__sub {
  margin-top: 6px;
  color: var(--ink-soft);
  max-width: var(--measure);
}

.masthead__meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-dim);
}
.masthead__meta b { color: var(--ink-soft); font-weight: 500; }

.themetoggle {
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: transparent;
  border: 1px solid var(--hairline);
  padding: 5px 9px;
  cursor: pointer;
}
.themetoggle:hover { color: var(--accent); border-color: var(--accent-soft); }

/* -- Status band ---------------------------------------------------- */
.band {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.35fr);
  gap: 28px 40px;
  padding-block: 28px;
  border-bottom: 1px solid var(--hairline);
}

.headline__value {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: clamp(52px, 8vw, 78px);
  line-height: 0.9;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.headline__unit { font-size: 0.42em; letter-spacing: 0; color: var(--ink-dim); }
.headline__note { margin-top: 10px; color: var(--ink-dim); font-size: 13px; max-width: 42ch; }
.headline .gauge { margin-top: 16px; }

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 6px;
  align-content: start;
}

.tile {
  background: var(--panel);
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  border: 1px solid var(--hairline);
  border-top: 2px solid var(--tile-hue, var(--hairline));
  cursor: pointer;
  font: inherit;
  color: inherit;
}
.tile:hover { background: var(--accent-wash); }
.tile[aria-pressed="true"] { background: var(--accent-wash); }
.tile[aria-pressed="true"] .tile__count { color: var(--tile-hue, var(--accent)); }

.tile__count {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 30px;
  line-height: 1;
  color: var(--ink);
}
.tile__label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
               text-transform: uppercase; color: var(--ink-dim); }

.split { display: flex; gap: 2px; height: 12px; margin-top: 4px; }
.split__seg { min-width: 2px; }
.split__key { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; }
.split__key li {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim);
}
.split__key i { width: 9px; height: 9px; flex: none; }

/* Work that has not started is drawn hollow rather than solid, so the two
   neutral states stay apart for colourblind readers and in print. */
.hatch {
  background-image: repeating-linear-gradient(
    45deg, transparent 0 3px, var(--ground) 3px 5px);
}
.split__key b { color: var(--ink-soft); font-weight: 500; }

/* -- Gauge: a segmented meter, in the manner of an equipment gauge -- */
.gauge {
  position: relative;
  height: 10px;
  background: var(--gauge-track);
  overflow: hidden;
}
.gauge__fill {
  height: 100%;
  width: var(--pct, 0%);
  background: var(--gauge-hue, var(--accent));
}
.gauge::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    90deg,
    transparent 0 calc(5% - 2px),
    var(--gauge-gap) calc(5% - 2px) 5%
  );
}
.gauge--tall { height: 14px; }

/* -- Controls ------------------------------------------------------- */
.controls {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding-block: 12px;
  background: var(--ground);
  border-bottom: 1px solid var(--hairline);
}

.search {
  flex: 1 1 230px;
  min-width: 190px;
  background: var(--panel-sunk);
  border: 1px solid var(--hairline);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 8px 10px;
}
.search::placeholder { color: var(--ink-dim); }
.search:focus { border-color: var(--accent-soft); outline: none; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: transparent;
  border: 1px solid var(--hairline);
  padding: 6px 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.chip:hover { color: var(--ink); border-color: var(--hairline-hi); }
.chip[aria-pressed="true"] {
  color: var(--ink);
  border-color: var(--chip-hue, var(--accent));
  background: var(--accent-wash);
}
.chip__dot { width: 8px; height: 8px; background: var(--chip-hue, var(--ink-dim)); flex: none; }
.chip__n { color: var(--ink-dim); }

.controls__count {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-dim);
  margin-left: auto;
}

/* -- Streams -------------------------------------------------------- */
.streams { padding-block: 4px 56px; display: flex; flex-direction: column; }

.stream { border-bottom: 1px solid var(--hairline); }
.stream[hidden] { display: none; }

.stream__head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px 18px;
  width: 100%;
  padding: 18px 0 14px;
  background: transparent;
  border: 0;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.stream__head:hover .stream__name { color: var(--accent); }

.stream__code {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--accent);
  border: 1px solid var(--hairline-hi);
  padding: 4px 8px;
}

.stream__name {
  font-family: var(--font-display);
  font-stretch: condensed;
  font-size: clamp(18px, 2.2vw, 23px);
  letter-spacing: 0.01em;
  text-transform: uppercase;
}

.stream__right {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-dim);
}
.stream__right .gauge { width: 132px; }
.stream__pct { color: var(--ink-soft); min-width: 4ch; text-align: right; }
.stream__caret { color: var(--ink-dim); transition: transform 0.18s ease; }
.stream__head[aria-expanded="false"] .stream__caret { transform: rotate(-90deg); }

.stream__summary {
  color: var(--ink-soft);
  max-width: var(--measure);
  margin-bottom: 18px;
  font-size: 14px;
}

.items { display: flex; flex-direction: column; gap: 1px; background: var(--hairline);
         margin-bottom: 22px; }

/* -- Item ----------------------------------------------------------- */
.item {
  display: grid;
  grid-template-columns: 8.5rem minmax(0, 1fr) 13rem;
  gap: 12px 22px;
  padding: 16px 16px 18px;
  background: var(--panel);
  border-left: 2px solid var(--state-hue);
}
.item[hidden] { display: none; }
.item:target { background: var(--accent-wash); }

.item__mark { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

.item__id {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
}

/* The label wears a text token and the glyph carries the state colour, so
   the pill never depends on colour alone and never asks small text to
   hold contrast at a mark colour. */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border: 1px solid var(--state-hue);
  padding: 3px 7px;
  white-space: nowrap;
}
.pill__glyph { font-size: 10px; line-height: 1; color: var(--state-hue); }

.item__title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.005em;
  margin-bottom: 6px;
}
.item__desc { color: var(--ink-soft); max-width: var(--measure); font-size: 14px; }

.item__why {
  margin-top: 12px;
  padding-left: 13px;
  border-left: 1px solid var(--hairline-hi);
  max-width: var(--measure);
}
.item__why p { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
body[data-rationale="off"] .item__why { display: none; }

.item__links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
.item__links a { font-family: var(--font-mono); font-size: 11.5px; }

.item__gauge { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.item__gauge .gauge { width: 100%; }
.item__pct {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 26px;
  line-height: 1;
  color: var(--ink-soft);
}
.item__pct span { font-size: 0.5em; color: var(--ink-dim); }
.item__facts { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.item__facts span {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
}
.item__facts b { color: var(--ink-soft); font-weight: 500; }

.empty {
  padding: 48px 0 64px;
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 13px;
}

/* -- Footer --------------------------------------------------------- */
.foot {
  border-top: 1px solid var(--hairline);
  background: var(--panel-sunk);
  padding-block: 20px 28px;
}
.foot p {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-dim);
  max-width: 90ch;
}
.foot code { color: var(--ink-soft); }

/* -- Narrow screens ------------------------------------------------- */
@media (max-width: 900px) {
  .band { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .item { grid-template-columns: 1fr; }
  .item__mark { flex-direction: row; align-items: center; gap: 12px; }
  .item__gauge { flex-direction: row; align-items: center; gap: 14px; }
  .item__gauge .gauge { flex: 1; }
  .stream__head { grid-template-columns: auto 1fr; }
  .stream__right { grid-column: 1 / -1; }
  .controls { position: static; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* -- Print: the briefing version ------------------------------------ */
@media print {
  .controls, .themetoggle, .skip { display: none !important; }
  body { background: #fff; color: #111; font-size: 11pt; }
  .stream, .item, .tiles { break-inside: avoid; }
  .item { border-left-width: 3px; }
  .masthead, .foot { background: #fff; }
  a { color: inherit; }
}
</style>
<!-- HEAD-STYLE:END -->
</head>
<body>
<!-- BODY:BEGIN -->
<a class="skip" href="#streams">Skip to the roadmap</a>

<header class="masthead">
  <div class="shell masthead__inner">
    <div>
      <h1 class="masthead__title" id="rm-title">Roadmap</h1>
      <p class="masthead__sub" id="rm-sub"></p>
    </div>
    <div class="masthead__meta">
      <span>Updated <b id="rm-updated">—</b></span>
      <span>Source <b id="rm-source">—</b></span>
      <button class="themetoggle" type="button" id="rm-theme">Switch theme</button>
    </div>
  </div>
</header>

<main>
  <section class="shell band" aria-label="Summary">
    <div class="headline">
      <p class="label">Overall progress</p>
      <p class="headline__value"><span id="rm-overall">0</span><span
         class="headline__unit">%</span></p>
      <div class="gauge gauge--tall" id="rm-overall-gauge" style="--pct:0%">
        <div class="gauge__fill"></div>
      </div>
      <p class="headline__note" id="rm-overall-note"></p>
    </div>

    <div>
      <p class="label">Where the work stands</p>
      <div class="tiles" id="rm-tiles"></div>
      <div class="split" id="rm-split" role="img" aria-label="Distribution of items by state"></div>
      <ul class="split__key" id="rm-key"></ul>
    </div>
  </section>

  <div class="shell">
    <div class="controls">
      <label class="skip" for="rm-search">Search roadmap items</label>
      <input class="search" id="rm-search" type="search"
             placeholder="Search all fields…" autocomplete="off">
      <div class="chips" id="rm-stream-chips"></div>
      <button class="chip" type="button" id="rm-rationale" aria-pressed="true">Rationale</button>
      <button class="chip" type="button" id="rm-collapse" aria-pressed="false">Collapse all</button>
      <span class="controls__count" id="rm-count"></span>
    </div>

    <div class="streams" id="streams"></div>
    <p class="empty" id="rm-empty" hidden>
      No items match that filter. Clear the search box or re-select a state above.
    </p>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <p id="rm-foot"></p>
  </div>
</footer>

          "description": "The `~/load_bt` and `~/stop_execution` services call `loadAndExecute()` and `haltExecution()` straight from the ROS2 service callback, while `on_tick()` runs on the PCL executor thread. Add `enqueueBtXml()` and `enqueueHalt()` to `ExecutorComponent`, drain them in `on_tick()`, and drop the `exec_mutex_` that is papering over the problem.",
          "rationale": "Two threads touch executor state with no ordering between them, so a service call arriving mid-tick can leave the running behaviour tree in an inconsistent state. This is a correctness defect in the execution path, which is the part of the system that moves the vehicle.",
          "progress": 0,
          "status": "at-risk",
          "effort": "Small"
        },
        {
          "id": "PCL-2",
          "title": "Route ROS2 world-model writes through PCL ingress",
          "description": "`WorldModelComponent::setFact()` is protected by a mutex, but that sidesteps the single-writer model PCL is built around. Writes arriving over ROS2 should enter through the component's ingress queue like every other message.",
          "rationale": "A mutex makes each write atomic but leaves their order undefined relative to the component's own processing. The single-writer model is what makes world model state reproducible when replaying an audit log.",
          "progress": 0
        },
        {
          "id": "PCL-3",
          "title": "Remove the PlannerNode detached planning thread",
          "description": "The ROS2 planning action currently spawns its own detached thread. Route it to the `plan` service that already exists on the PCL planner component instead.",
          "rationale": "A detached thread has no lifecycle tie to the node that started it, so shutdown and cancellation are unreliable, and the work bypasses the component boundary that the rest of the system is verified against.",
          "progress": 0
        },
        {
          "id": "PCL-4",
          "title": "AME ROS2 PCL transport",
          "description": "Implement a `pcl_transport_t` backed by ROS2 so that AME's PCL ports appear as ordinary ROS2 topics and services, then remove the bypass services and publishers that exist only because that transport is missing.",
          "rationale": "Every bypass is a second way into the system that has to be reviewed, tested, and kept in step with the first. One transport removes the whole category.",
          "progress": 0,
          "effort": "Large"
        },
        {
          "id": "PCL-5",
          "title": "Compatibility test focus",
          "description": "Cover the parts the migration changes: executor enqueue ordering, the compatibility bridges running over ingress rather than direct calls, transport mapping, and a smoke test of `combined_main`.",
          "rationale": "The migration moves calls from one path to another without changing what they do, so the risk is regression rather than new behaviour. Tests aimed at the seams are what catch that.",
          "progress": 0
        }
      ]
    },
    {
      "code": "TEMPORAL",
      "name": "Extension 7 — temporal planning",
      "summary": "Support PDDL 2.1 durative actions, converted into a simple temporal network so that overlapping, timed activity can be planned and executed. OPTIC is the recommended first planner, with Aries evaluated later; LAPKT stays in place for domains without durations.",
      "items": [
        {
          "id": "TEMPORAL-7a",
          "title": "PDDL 2.1 parser support",
          "description": "Extend the parser to accept `:durative-action` and `:functions`, so domains can express how long an action takes and what numbers it reads and changes.",
          "rationale": "Nothing else in the temporal extension can be built or tested until the planner can read a domain that states durations.",
          "progress": 0,
          "effort": "Medium"
        },
        {
          "id": "TEMPORAL-7b",
          "title": "World model numeric fluent store",
          "description": "Hold numeric state such as fuel, battery charge, or elapsed time in the world model alongside the true-or-false facts it stores today, with the same audit trail.",
          "rationale": "Durative domains reason about quantities, not just facts. Without a place to keep them, timing and resource constraints cannot be checked during execution.",
          "progress": 0,
          "effort": "Medium"
        },
        {
          "id": "TEMPORAL-7c",
          "title": "Planner backend abstraction and OPTIC",
          "description": "Introduce an `IPlannerBackend` interface and add an implementation that invokes OPTIC as a subprocess, so the engine can choose a solver by domain rather than being wired to one.",
          "rationale": "Temporal solvers are research tools with short lifetimes and different licences. An interface means swapping one for another is a contained change instead of a rewrite.",
          "progress": 0,
          "effort": "Medium"
        },
        {
          "id": "TEMPORAL-7d",
          "title": "Simple temporal network and consistency check",
          "description": "Add the data structure that holds the timing constraints between plan steps, and the check that decides whether those constraints can all be satisfied at once.",
          "rationale": "A temporal plan that is internally inconsistent cannot be executed. It is far cheaper to reject it before compilation than to discover the conflict on the vehicle.",
          "progress": 0,
          "effort": "Low"
        },
        {
          "id": "TEMPORAL-7e",
          "title": "PlanCompiler temporal mode",
          "description": "Compile a timing network into behaviour tree structure, mapping concurrent activity onto `Parallel` nodes and deadlines onto `Timeout` decorators.",
          "rationale": "This is where the temporal extension either works or does not. The existing compiler assumes one action follows another, and concurrency changes how failure and halting propagate through the tree.",
          "progress": 0,
          "effort": "High"
        },
        {
          "id": "TEMPORAL-7f",
          "title": "VAL plan validation",
          "description": "Run generated temporal plans through VAL, the standard PDDL plan validator, as an independent check that the plan achieves the goal under the domain's own rules.",
          "rationale": "Checking the solver's output with a tool that was not written by the same project is one of the cheapest pieces of evidence available.",
          "progress": 0,
          "effort": "Low"
        },
        {
          "id": "TEMPORAL-7g",
          "title": "Temporal invariant monitoring",
          "description": "Use `ReactiveSequence` nodes to keep checking, throughout an action's duration, the conditions that must hold for the whole of it.",
          "rationale": "A durative action states conditions that must remain true while it runs. If nothing re-checks them, the plan is only valid at the moment it was made.",
          "progress": 0,
          "effort": "Low"
        },
        {
          "id": "TEMPORAL-7h",
          "title": "End-to-end temporal tests",
          "description": "Take a durative domain from parsing through planning, compilation, and execution, including the cases where a deadline is missed and where an invariant is broken partway through.",
          "rationale": "The pieces above can each pass in isolation and still not compose. The end-to-end path is what the mission actually exercises.",
          "progress": 0,
          "effort": "Medium"
        },
        {
          "id": "TEMPORAL-7i",
          "title": "Aries evaluation",
          "description": "Assess Aries, a Rust planner with a built-in temporal network solver and support for hierarchical domains, as a replacement for the OPTIC subprocess.",
          "rationale": "OPTIC is the pragmatic first choice, not the intended destination. Aries removes the subprocess boundary and handles hierarchy, but the cost of moving is only knowable after the backend interface exists.",
          "progress": 0,
          "effort": "Medium"
        }
      ]
    },
    {
      "code": "NEURO",
      "name": "Extension 8 — neuro-symbolic integration",
      "summary": "Neural components advise; the symbolic system stays authoritative. Every neural suggestion is checked by the existing planner and world model before it can affect a mission.",
      "items": [
        {
          "id": "NEURO-1",
          "title": "State-authority semantics",
          "description": "Distinguish in the world model between facts believed because a plan step was expected to make them true, and facts confirmed by perception.",
          "rationale": "Once a neural component can assert something about the world, the engine has to know whether a fact came from a model's guess or from a sensor. Without that distinction there is no principled way to decide which one wins.",
          "progress": 0,
          "status": "planned"
        },
        {
          "id": "NEURO-2",
          "title": "Neural acceptance criteria",
          "description": "Fix the terms a neural component runs under: a latency budget of around 500 milliseconds, a fall back to the LAPKT planner on timeout or error, and an audit record of every call.",
          "rationale": "Written limits are what make a neural component reviewable. They also define the fallback path, so a slow or failing model degrades the mission rather than stopping it.",

        },

          "description": "Turn a natural-language instruction into grounded PDDL goals, with the symbolic layer rejecting any goal that names fluents or objects that do not exist.",

          "progress": 0
        },
        {
          "id": "NEURO-5",
          "title": "Planner-adjacent and data-driven components",
          "description": "Deferred work: a learned search heuristic, plan repair, an anomaly detector, and neural help with authoring PDDL domains.",
          "rationale": "These sit closer to decisions that matter, so they are held back until the envelope of checks and fallbacks from the earlier items is proven on the low-risk cases.",
          "progress": 0,
          "status": "planned"
        }
      ]
    },
    {
      "code": "ASSURE",
      "name": "Autonomy assurance gaps",
      "summary": "Gaps identified by the SACE Stage 8 analysis. High-priority items first, then the medium-priority set.",
      "items": [
        {
          "id": "ASSURE-1",
          "title": "Property-based planner testing",
          "description": "Generate random but valid PDDL domains with a fuzzer, and assert that simulating the returned plan actually reaches the goal.",
          "rationale": "Hand-written tests cover the domains someone thought of. Property-based testing attacks the claim that the solver is sound across the space of domains, which is what the safety argument depends on.",
          "progress": 0
        },
        {
          "id": "ASSURE-2",
          "title": "Adversarial perception testing",
          "description": "Inject malicious, stale, and self-contradictory data through the ROS2 `setFact()` service and confirm it is rejected.",
          "rationale": "The world model believes what perception tells it. If bad input is accepted, the planner will produce a technically correct plan for a world that does not exist.",
          "progress": 0
        },
        {
          "id": "ASSURE-3",
          "title": "Safe-state integration tests",
          "description": "End-to-end tests that force a planning timeout, a loss of communications, and an action with no registered implementation, and check that each ends in the fallback behaviour tree.",
          "rationale": "Degrading to a safe state is claimed behaviour. Until the tests drive the system into those conditions, the claim rests on code reading.",
          "progress": 0
        },
        {
          "id": "ASSURE-4",
          "title": "Out-of-context detection",
          "description": "Bounds-checking in the world model plus a `CheckContext` behaviour tree node, so a mission can be held to a geographic boundary.",
          "rationale": "The engine should stop when it is operating outside the conditions it was assured for, and a geofence is the clearest case of that.",
          "progress": 0,
          "status": "planned"
        },
        {
          "id": "ASSURE-5",
          "title": "Threat model",
          "description": "Write `threat_model.md` covering perception spoofing, injection of hostile PDDL, and denial of planning.",
          "rationale": "The system takes formal input from outside and acts on it physically. Naming the threats is the step that turns scattered concerns into testable requirements.",
          "progress": 0,
          "status": "planned"
        },
        {

          "title": "Performance benchmarks",
          "description": "Put thresholds on LAPKT solve time in continuous integration, and stress the behaviour tree at a 50 Hz tick rate.",
          "rationale": "Planning latency is a safety property once the vehicle is moving, and performance regressions arrive quietly unless something measures them on every change.",
          "progress": 0,
          "status": "planned"
        },
        {
          "id": "ASSURE-7",
          "title": "Compiler correctness checks",

          "rationale": "The compiler sits between a plan that has been validated and the tree that actually runs. A round-trip check is the direct test that nothing is lost or reordered in between.",
          "progress": 0,
          "status": "planned"
        }
      ]
    },
    {
      "code": "HARDEN",
      "name": "Hardening for production",
      "summary": "The work that turns a demonstrable pipeline into something that can be deployed, configured, and diagnosed by people who did not build it.",
      "items": [
        {
          "id": "HARDEN-1",
          "title": "Solver portfolio and budgets",
          "description": "Try a fast heuristic search first and fall back to a complete search if it fails, under a configurable time and node budget with proper timeout handling.",
          "rationale": "Most missions are solved quickly by a heuristic; a few need the slow complete search. A fixed choice is either too slow in the common case or gives up in the hard one.",
          "progress": 0
        },
        {
          "id": "HARDEN-2",
          "title": "ActionRegistry configuration and validation",
          "description": "Register actions from a YAML or JSON configuration file, type-check parameter binding against the PDDL schema, and validate at startup that every action in the domain has an implementation.",
          "rationale": "A missing action implementation currently surfaces as a failure partway through a mission. It should be caught before the vehicle moves.",
          "progress": 0
        },
        {
          "id": "HARDEN-3",
          "title": "Failure taxonomy and new behaviour tree nodes",
          "description": "Classify failures as transient, permanent, or fatal, and add the `WaitForFact` node, a `Timeout` decorator, and a `RetryWithBackoff` node.",
          "rationale": "Today every failure triggers the same response. Retrying a momentary radio dropout and replanning around a broken effector are different problems, and treating them alike wastes time on one and hides the other.",
          "progress": 0
        },
        {
          "id": "HARDEN-4",
          "title": "PlanCompiler inspection output",
          "description": "Write the compiled behaviour tree to a file, emit a DOT graph of the causal structure, and handle synchronisation where parallel branches rejoin.",
          "rationale": "The compiler's output is currently only visible by running it. Being able to look at the tree is what makes compilation reviewable during an investigation.",
          "progress": 0
        },
        {
          "id": "HARDEN-5",
          "title": "Progressive replanning",
          "description": "Escalate through retry, local replan, full replan, goal relaxation, and finally abort, with a cap on how many replans a mission may use and a world model consistency check before each one.",
          "rationale": "Replanning from scratch for a small local failure is slow and can loop. A ladder of responses spends the least effort that resolves the problem and puts a bound on the worst case.",
          "progress": 0
        },
        {
          "id": "HARDEN-6",
          "title": "PDDL parser diagnostics",
          "description": "Report errors with line and column, and validate predicate arities, type consistency, and goals that cannot be reached.",
          "rationale": "Domain authors are the parser's users. An error that names the line is the difference between a minute and an afternoon.",
          "progress": 0
        },
        {
          "id": "HARDEN-7",
          "title": "Configuration and packaging",
          "description": "A YAML configuration for domain paths, solver selection, action mappings, and logging; graceful ROS2 lifecycle shutdown with state preserved; and Debian, colcon, Docker, and continuous integration packaging.",
          "rationale": "Deployment currently depends on knowing which paths are compiled in. Configuration and packaging are what let someone else run the system.",
          "progress": 0
        },
        {
          "id": "HARDEN-8",
          "title": "Test depth",
          "description": "Property-based and fuzz tests for registration ordering, systematic fault injection, planning time against domain size, and a GitHub Actions build matrix with CTest and coverage.",
          "rationale": "The suite is broad but was written alongside the features. These tests attack the system rather than confirm it, which is where the remaining defects are.",

        }

    },
    {
      "code": "FUTURE",
      "name": "Beyond the extensions",
      "summary": "Work that is understood and wanted, but not scheduled. Listed so that it is not rediscovered later as though it were new.",
      "items": [
        {
          "id": "FUTURE-1",
          "title": "Plan quality optimisation",

          "rationale": "The engine currently returns the first plan that works. Fuel and time budgets make the difference between a working plan and a good one worth having.",
          "progress": 0,

        },
        {
          "id": "FUTURE-2",
          "title": "Advanced heuristics",

          "rationale": "Search cost grows sharply with domain size, and heuristics are the lever that moves it most.",
          "progress": 0,
          "status": "planned"
        },
        {
          "id": "FUTURE-3",
          "title": "Dynamic object lifecycle",
          "description": "Allow objects to be created and destroyed during a mission rather than fixed when the problem is grounded.",
          "rationale": "Real missions discover things that were not in the problem file. Today the grounded set is closed once planning begins.",
          "progress": 0,
          "status": "planned"
        },
        {
          "id": "FUTURE-4",
          "title": "Resource-aware scheduling and coordination",
          "description": "Schedule around shared resources that only one agent may hold at a time, add synchronisation barriers, and re-allocate work when an agent fails.",
          "rationale": "Multi-agent planning currently assumes agents do not contend for the same resources, which stops being true as soon as they share a corridor or a charging point.",
          "progress": 0,

        },
        {
          "id": "FUTURE-5",

          "progress": 0,

<script>
(function () {
  "use strict";

  /* Item state. Order matters: it is the order tiles, chips and the
     distribution bar are drawn in, running from finished to urgent. */
  var STATES = [
    { key: "done",    label: "Complete",  glyph: "■", hue: "var(--state-done)" },
    { key: "active",  label: "In flight", glyph: "◐", hue: "var(--state-active)" },
    { key: "planned", label: "Planned",   glyph: "○", hue: "var(--state-planned)" },
    { key: "at-risk", label: "At risk",   glyph: "▲", hue: "var(--state-risk)" },
    { key: "blocked", label: "Blocked",   glyph: "✖", hue: "var(--state-blocked)" }
  ];
  var STATE_BY_KEY = {};
  STATES.forEach(function (s) { STATE_BY_KEY[s.key] = s; });

  var data = JSON.parse(document.getElementById("roadmap-data").textContent);
  var streams = (data.streams || []).map(function (stream, si) {
    var items = (stream.items || []).map(function (item, ii) {
      var progress = clamp(Number(item.progress) || 0);
      var state = STATE_BY_KEY[item.status] ? item.status : deriveState(progress);
      return {
        id: item.id || (stream.code || "S" + si) + "-" + (ii + 1),
        title: item.title || "Untitled item",
        description: item.description || "",
        rationale: item.rationale || "",
        progress: progress,
        state: state,
        owner: item.owner || "",
        effort: item.effort || "",
        target: item.target || "",
        tags: item.tags || [],
        links: item.links || []
      };
    });
    return {
      code: stream.code || "S" + (si + 1),
      name: stream.name || "Stream " + (si + 1),
      summary: stream.summary || "",
      items: items,
      progress: mean(items.map(function (i) { return i.progress; }))
    };
  });

  var allItems = streams.reduce(function (acc, s) { return acc.concat(s.items); }, []);
  var filters = { text: "", states: {}, stream: null };

  function clamp(n) { return Math.max(0, Math.min(100, Math.round(n))); }
  function mean(xs) { return xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : 0; }
  function deriveState(p) { return p >= 100 ? "done" : (p > 0 ? "active" : "planned"); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = text; }
    return n;
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /* Prose fields may mark identifiers with `backticks`. Split on them and
     build the nodes directly, so roadmap text is never treated as markup. */
  function prose(tag, cls, text) {
    var node = el(tag, cls);
    String(text).split("`").forEach(function (part, index) {
      if (!part) { return; }
      node.appendChild(index % 2 ? el("code", null, part) : document.createTextNode(part));
    });
    return node;
  }

  /* -- Masthead and footer ----------------------------------------- */
  document.title = data.title ? data.title + " — roadmap" : "Roadmap";
  document.getElementById("rm-title").textContent = data.title || "Roadmap";
  var sub = document.getElementById("rm-sub");
  if (data.subtitle) { sub.textContent = data.subtitle; } else { sub.hidden = true; }
  document.getElementById("rm-updated").textContent = data.updated || "not stated";
  document.getElementById("rm-source").textContent = data.source || "not stated";
  document.getElementById("rm-foot").textContent =
    "Progress figures are the plain mean of item progress, so every item counts the same. " +
    "Edit the data block in this file, or regenerate the page from its roadmap file with " +
    "tools/roadmap/generate_roadmap.py.";

  /* -- Summary band ------------------------------------------------- */
  var counts = {};
  STATES.forEach(function (s) { counts[s.key] = 0; });
  allItems.forEach(function (i) { counts[i.state] += 1; });

  var overall = Math.round(mean(allItems.map(function (i) { return i.progress; })));
  document.getElementById("rm-overall").textContent = overall;
  var og = document.getElementById("rm-overall-gauge");
  og.style.setProperty("--pct", overall + "%");
  og.appendChild(el("div", "gauge__fill"));
  document.getElementById("rm-overall-note").textContent =
    plural(allItems.length, "item", "items") + " across " +
    plural(streams.length, "stream", "streams") + ", " +
    counts.done + " complete and " + (counts["at-risk"] + counts.blocked) +
    " needing attention.";

  var tiles = document.getElementById("rm-tiles");
  STATES.forEach(function (s) {
    var b = el("button", "tile");
    b.type = "button";
    b.style.setProperty("--tile-hue", s.hue);
    b.setAttribute("aria-pressed", "false");
    b.dataset.state = s.key;
    b.appendChild(el("span", "tile__count mono", String(counts[s.key])));
    b.appendChild(el("span", "tile__label", s.label));
    b.addEventListener("click", function () { toggleState(s.key); });
    tiles.appendChild(b);
  });

  var split = document.getElementById("rm-split");
  var key = document.getElementById("rm-key");
  STATES.forEach(function (s) {
    if (!counts[s.key]) { return; }
    var hollow = s.key === "planned" ? " hatch" : "";
    var seg = el("div", "split__seg" + hollow);
    seg.style.flex = counts[s.key];
    seg.style.backgroundColor = s.hue;
    split.appendChild(seg);

    var li = el("li");
    var swatch = el("i", hollow ? "hatch" : null);
    swatch.style.backgroundColor = s.hue;
    li.appendChild(swatch);
    li.appendChild(el("b", null, String(counts[s.key])));
    li.appendChild(el("span", null, s.label));
    key.appendChild(li);
  });

  /* -- Stream filter chips ------------------------------------------ */
  var streamChips = document.getElementById("rm-stream-chips");
  streams.forEach(function (s) {
    var b = el("button", "chip");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.appendChild(el("span", null, s.code));
    b.appendChild(el("span", "chip__n", String(s.items.length)));
    b.addEventListener("click", function () {
      filters.stream = filters.stream === s.code ? null : s.code;
      syncChips();
      apply();
    });
    b.dataset.stream = s.code;
    streamChips.appendChild(b);
  });

  /* -- Streams and items -------------------------------------------- */
  var host = document.getElementById("streams");
  streams.forEach(function (stream) {
    var section = el("section", "stream");
    section.dataset.stream = stream.code;

    var head = el("button", "stream__head");
    head.type = "button";
    head.setAttribute("aria-expanded", "true");
    head.appendChild(el("span", "stream__code", stream.code));

    var mid = el("div");
    mid.appendChild(el("h2", "stream__name", stream.name));
    head.appendChild(mid);

    var right = el("div", "stream__right");
    var openCount = stream.items.filter(function (i) { return i.state !== "done"; }).length;
    var counter = el("span", null, openCount + " of " + stream.items.length + " open");
    right.appendChild(counter);
    var g = el("div", "gauge");
    g.style.setProperty("--pct", Math.round(stream.progress) + "%");
    g.appendChild(el("div", "gauge__fill"));
    right.appendChild(g);
    right.appendChild(el("span", "stream__pct", Math.round(stream.progress) + "%"));
    right.appendChild(el("span", "stream__caret", "▾"));
    head.appendChild(right);
    section.appendChild(head);

    var panel = el("div", "stream__panel");
    if (stream.summary) { panel.appendChild(prose("p", "stream__summary", stream.summary)); }

    var list = el("ol", "items");
    stream.items.forEach(function (item) {
      list.appendChild(renderItem(item, stream));
    });
    panel.appendChild(list);
    section.appendChild(panel);

    head.addEventListener("click", function () {
      var open = head.getAttribute("aria-expanded") === "true";
      head.setAttribute("aria-expanded", open ? "false" : "true");
      panel.hidden = open;
    });

    host.appendChild(section);
  });

  function renderItem(item, stream) {
    var state = STATE_BY_KEY[item.state];
    var li = el("li", "item");
    li.id = "item-" + item.id;
    li.dataset.state = item.state;
    li.dataset.stream = stream.code;
    li.style.setProperty("--state-hue", state.hue);
    li.style.setProperty("--gauge-hue", state.hue);
    li.dataset.haystack = [item.id, item.title, item.description, item.rationale,
                           item.owner, (item.tags || []).join(" ")].join(" ").toLowerCase();

    var mark = el("div", "item__mark");
    mark.appendChild(el("span", "item__id", item.id));
    var pill = el("span", "pill");
    pill.appendChild(el("span", "pill__glyph", state.glyph));
    pill.appendChild(el("span", null, state.label));
    mark.appendChild(pill);
    li.appendChild(mark);

    var body = el("div", "item__body");
    body.appendChild(el("h3", "item__title", item.title));
    if (item.description) { body.appendChild(prose("p", "item__desc", item.description)); }
    if (item.rationale) {
      var why = el("div", "item__why");
      why.appendChild(el("p", "label", "Rationale"));
      why.appendChild(prose("p", null, item.rationale));
      body.appendChild(why);
    }
    if (item.links && item.links.length) {
      var links = el("ul", "item__links");
      item.links.forEach(function (link) {
        var a = el("a", null, link.label || link.url);
        a.href = link.url;
        var li2 = el("li");
        li2.appendChild(a);
        links.appendChild(li2);
      });
      body.appendChild(links);
    }
    li.appendChild(body);

    var gaugeCell = el("div", "item__gauge");
    var pct = el("span", "item__pct", String(item.progress));
    pct.appendChild(el("span", null, "%"));
    gaugeCell.appendChild(pct);
    var g = el("div", "gauge");
    g.style.setProperty("--pct", item.progress + "%");
    g.appendChild(el("div", "gauge__fill"));
    gaugeCell.appendChild(g);

    var facts = el("div", "item__facts");
    if (item.effort) { facts.appendChild(fact("Effort", item.effort)); }
    if (item.owner) { facts.appendChild(fact("Owner", item.owner)); }
    if (item.target) { facts.appendChild(fact("Target", item.target)); }
    if (facts.childNodes.length) { gaugeCell.appendChild(facts); }
    li.appendChild(gaugeCell);

    return li;
  }

  function fact(name, value) {
    var s = el("span");
    s.appendChild(document.createTextNode(name + " "));
    s.appendChild(el("b", null, value));
    return s;
  }

  /* -- Filtering ----------------------------------------------------- */
  function activeStates() {
    return Object.keys(filters.states).filter(function (k) { return filters.states[k]; });
  }

  function toggleState(k) {
    filters.states[k] = !filters.states[k];
    syncChips();
    apply();
  }

  function syncChips() {
    Array.prototype.forEach.call(tiles.children, function (b) {
      b.setAttribute("aria-pressed", filters.states[b.dataset.state] ? "true" : "false");
    });
    Array.prototype.forEach.call(streamChips.children, function (b) {
      b.setAttribute("aria-pressed", filters.stream === b.dataset.stream ? "true" : "false");
    });
  }

  function apply() {
    var wanted = activeStates();
    var text = filters.text;
    var shown = 0;

    Array.prototype.forEach.call(host.querySelectorAll(".item"), function (li) {
      var ok = true;
      if (wanted.length && wanted.indexOf(li.dataset.state) === -1) { ok = false; }
      if (ok && filters.stream && li.dataset.stream !== filters.stream) { ok = false; }
      if (ok && text && li.dataset.haystack.indexOf(text) === -1) { ok = false; }
      li.hidden = !ok;
      if (ok) { shown += 1; }
    });

    Array.prototype.forEach.call(host.querySelectorAll(".stream"), function (section) {
      var any = section.querySelector(".item:not([hidden])");
      section.hidden = !any;
    });

    document.getElementById("rm-empty").hidden = shown !== 0;
    document.getElementById("rm-count").textContent =
      shown === allItems.length
        ? plural(allItems.length, "item", "items")
        : shown + " of " + allItems.length + " items";
  }

  document.getElementById("rm-search").addEventListener("input", function (e) {
    filters.text = e.target.value.trim().toLowerCase();
    apply();
  });

  var rationaleBtn = document.getElementById("rm-rationale");
  rationaleBtn.addEventListener("click", function () {
    var on = rationaleBtn.getAttribute("aria-pressed") === "true";
    rationaleBtn.setAttribute("aria-pressed", on ? "false" : "true");
    document.body.dataset.rationale = on ? "off" : "on";
  });

  var collapseBtn = document.getElementById("rm-collapse");
  collapseBtn.addEventListener("click", function () {
    var collapse = collapseBtn.getAttribute("aria-pressed") === "false";
    collapseBtn.setAttribute("aria-pressed", collapse ? "true" : "false");
    collapseBtn.textContent = collapse ? "Expand all" : "Collapse all";
    Array.prototype.forEach.call(host.querySelectorAll(".stream"), function (section) {
      section.querySelector(".stream__head").setAttribute("aria-expanded", collapse ? "false" : "true");
      section.querySelector(".stream__panel").hidden = collapse;
    });
  });

  /* -- Theme ---------------------------------------------------------- */
  var root = document.documentElement;
  try {
    var saved = window.localStorage.getItem("roadmap-theme");
    if (saved) { root.setAttribute("data-theme", saved); }
  } catch (e) { /* storage unavailable; the media query still applies */ }

  document.getElementById("rm-theme").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme")
      ? root.getAttribute("data-theme") === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { window.localStorage.setItem("roadmap-theme", next); } catch (e) { /* ignore */ }
  });

  document.body.dataset.rationale = "on";
  apply();

  if (window.location.hash) {
    var target = document.getElementById(window.location.hash.slice(1));
    if (target) { target.scrollIntoView({ block: "center" }); }
  }
})();
</script>
<!-- BODY:END -->
</body>
</html>
